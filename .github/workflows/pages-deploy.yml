name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for GitHub Pages deployment
permissions:
  contents: read     # Checkout repository code
  pages: write       # Upload artifact to Pages
  id-token: write    # OIDC token for Pages deployment

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Base Path Strategy:
      # - Custom domain mode: USE_CUSTOM_DOMAIN=true → VITE_BASE_PATH="/" (root)
      # - User-page mode (username.github.io): USE_CUSTOM_DOMAIN=false, VITE_BASE_PATH="/" (root)
      # - Repo-page mode (username.github.io/repo): USE_CUSTOM_DOMAIN=false, VITE_BASE_PATH="/repo/" (subpath)
      # Must include trailing slash for proper asset path resolution.
      - name: Build frontend only
        run: pnpm exec vite build
        env:
          # Set to true when using custom domain (home.fezern8n.com) - forces root path
          USE_CUSTOM_DOMAIN: true
          # Base path: "/" for custom domain, "/repo/" for subpath GitHub Pages
          VITE_BASE_PATH: ${{ (env.USE_CUSTOM_DOMAIN == 'true') && '/' || (github.event.repository.name != github.repository_owner && format('/{0}/', github.event.repository.name) || '/') }}
          VITE_API_URL: https://api.fezern8n.com

      # SPA Fallback: GitHub Pages serves 404.html for missing routes.
      # The custom 404.html in client/public/ handles the redirect to index.html.
      # This enables refresh on routes like /blog, /portfolio without 404 errors.

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Upload artifact from dist/public (matches vite.config.ts build.outDir)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Smoke-check validates deployment health after GitHub Pages publish
  smoke-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      # Verify homepage returns HTTP 200 and contains JS bundle reference.
      # This ensures Vite build output is correctly served with proper base path.
      - name: Check homepage and bundle reference
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "🔍 Testing deployed site: $URL"
          
          # Test 1: Homepage HTTP status
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Homepage failed: HTTP $STATUS"
            exit 1
          fi
          echo "✅ Homepage returns HTTP $STATUS"
          
          # Test 2: HTML contains JS bundle reference (validates Vite asset paths)
          CONTENT=$(curl -s "$URL")
          if echo "$CONTENT" | grep -q "assets/.*\.js"; then
            echo "✅ JS bundle reference found in HTML"
          else
            echo "❌ No JS bundle reference found in HTML"
            echo "This indicates asset path misconfiguration or build failure"
            exit 1
          fi
          
          echo "✅ Smoke-check passed: Site deployed and serving static assets correctly"
