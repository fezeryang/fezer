<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --plastic-bg: #d1d5db;
            --plastic-highlight: #ffffff;
            --plastic-shadow: #8e949e;
            --plastic-deep-shadow: #374151;
            --accent-blue: #0046ff;
            --lcd-green: #a3e635;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            perspective: 1000px;
        }

        /* Industrial Grain Texture Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.04;
            z-index: 9999;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The FEZER Trigger - Heavy Industrial Bevel */
        .fezer-trigger {
            cursor: pointer;
            background: var(--plastic-bg);
            padding: 16px 40px;
            border: none;
            outline: none;
            position: relative;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 0.2rem;
            color: var(--plastic-deep-shadow);
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.1s cubic-bezier(0.2, 0, 0.2, 1);
            
            /* The 3D Bevel effect */
            box-shadow: 
                inset 3px 3px 0px var(--plastic-highlight),
                inset -3px -3px 0px var(--plastic-shadow),
                6px 6px 15px rgba(0,0,0,0.4);
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .fezer-trigger:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 
                inset -3px -3px 0px var(--plastic-highlight),
                inset 3px 3px 0px var(--plastic-shadow),
                2px 2px 5px rgba(0,0,0,0.4);
        }

        /* The Bubble Menu - Windows Aesthetic Hybrid */
        .bubble-menu {
            position: absolute;
            bottom: 120%;
            width: 280px;
            background: var(--plastic-bg);
            border: 1px solid #000;
            box-shadow: 
                inset 1px 1px 0px var(--plastic-highlight),
                inset -1px -1px 0px var(--plastic-shadow),
                10px 10px 0px rgba(0,0,0,0.2);
            padding: 4px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) rotateX(-15deg);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
        }

        .bubble-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) rotateX(0);
        }

        /* Windows Classic Style Header */
        .menu-header {
            background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
            color: white;
            padding: 4px 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .header-controls {
            display: flex;
            gap: 2px;
        }

        .win-btn {
            width: 14px;
            height: 14px;
            background: var(--plastic-bg);
            border: 1px solid #000;
            box-shadow: inset 1px 1px #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            color: #000;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2px;
        }

        .menu-item {
            padding: 10px 12px;
            background: transparent;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .menu-item:hover {
            background: var(--accent-blue);
            color: white;
            border: 1px dotted #fff;
        }

        .item-icon {
            width: 16px;
            height: 16px;
            background: #fff;
            box-shadow: inset 1px 1px #888, inset -1px -1px #eee;
            flex-shrink: 0;
        }

        .menu-item:hover .item-icon {
            background: var(--lcd-green);
        }

        .item-label {
            font-size: 13px;
            font-weight: 500;
        }

        .item-shortcut {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            opacity: 0.6;
        }

        /* Industrial Detail: Label below the trigger */
        .industrial-label {
            margin-top: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--lcd-green);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--lcd-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Decorative "Screws" */
        .screw {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #999;
            border-radius: 50%;
            box-shadow: inset 2px 2px 2px #555, 1px 1px 0px #fff;
        }
        .screw::after {
            content: '';
            position: absolute;
            top: 50%; left: 10%; width: 80%; height: 2px;
            background: #666;
            transform: rotate(45deg);
        }

        /* Corner accents for the menu */
        .menu-stem {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #000;
        }

    </style>
</head>
<body>

    <svg class="noise-overlay">
        <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#grain)"/>
    </svg>

    <div class="container">
        <!-- Decoration -->
        <div class="screw" style="top: -40px; left: -100px;"></div>
        <div class="screw" style="top: -40px; right: -100px;"></div>

        <!-- The Popover Bubble -->
        <div class="bubble-menu" id="bubbleMenu">
            <div class="menu-header">
                <span>SYSTEM_OVERRIDE.EXE</span>
                <div class="header-controls">
                    <div class="win-btn">_</div>
                    <div class="win-btn">×</div>
                </div>
            </div>
            <div class="menu-grid">
                <div class="menu-item">
                    <div class="item-icon"></div>
                    <span class="item-label">Initialize Protocol</span>
                    <span class="item-shortcut">F1</span>
                </div>
                <div class="menu-item">
                    <div class="item-icon"></div>
                    <span class="item-label">Deep Diagnostics</span>
                    <span class="item-shortcut">F5</span>
                </div>
                <div class="menu-item">
                    <div class="item-icon"></div>
                    <span class="item-label">Network Uplink</span>
                    <span class="item-shortcut">CTRL+N</span>
                </div>
                <div style="height: 1px; background: #888; margin: 2px 4px; box-shadow: 0 1px #fff;"></div>
                <div class="menu-item">
                    <div class="item-icon" style="background: #ff4d4d;"></div>
                    <span class="item-label">Emergency Eject</span>
                    <span class="item-shortcut">ESC</span>
                </div>
            </div>
            <div class="menu-stem"></div>
        </div>

        <!-- Trigger -->
        <button class="fezer-trigger" id="trigger">
            FEZER
        </button>

        <!-- Status Label -->
        <div class="industrial-label">
            <div class="status-dot"></div>
            <span>Module: active_v09</span>
            <span>|</span>
            <span>Auth: OK</span>
        </div>
    </div>

    <script>
        const trigger = document.getElementById('trigger');
        const menu = document.getElementById('bubbleMenu');

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            menu.classList.toggle('active');
            
            if(menu.classList.contains('active')) {
                // Play a subtle vintage click sound if needed
                trigger.style.transform = "translateY(2px) scale(0.98)";
                setTimeout(() => {
                    trigger.style.transform = "";
                }, 100);
            }
        });

        // Close when clicking outside
        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && e.target !== trigger) {
                menu.classList.remove('active');
            }
        });

        // Interaction for menu items
        const items = document.querySelectorAll('.menu-item');
        items.forEach(item => {
            item.addEventListener('click', () => {
                item.style.backgroundColor = 'var(--lcd-green)';
                setTimeout(() => {
                    menu.classList.remove('active');
                    item.style.backgroundColor = '';
                }, 150);
            });
        });
    </script>
</body>
</html>
