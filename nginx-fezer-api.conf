# Nginx 配置文件 - Fezer API 反向代理
#
# 使用方法：
# 1. 将此文件复制到 Azure VM 的 /etc/nginx/sites-available/fezer-api
# 2. 修改 server_name 为你的域名或 VM IP
# 3. 创建软链接：sudo ln -s /etc/nginx/sites-available/fezer-api /etc/nginx/sites-enabled/
# 4. 测试配置：sudo nginx -t
# 5. 重载 Nginx：sudo systemctl reload nginx

server {
    listen 80;
    server_name _;  # 修改为你的域名，如：api.yourdomain.com

    # 日志文件路径
    access_log /var/log/nginx/fezer-access.log;
    error_log /var/log/nginx/fezer-error.log;

    # API 反向代理配置
    location /api/ {
        # 转发到本地 Node.js 服务（端口 3000）
        proxy_pass http://localhost:3000/api/;

        # 使用 HTTP/1.1 协议
        proxy_http_version 1.1;

        # WebSocket 支持（如果需要实时通信）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 传递原始请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（Agent 调用可能需要较长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲区设置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # tRPC 路由（类型安全的 API）
    location /api/trpc/ {
        proxy_pass http://localhost:3000/api/trpc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }

    # 静态文件缓存（如果需要）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

