# Nginx Reverse Proxy Configuration for kinetic-portfolio API
# 
# Installation:
#   1. Copy to /etc/nginx/sites-available/kinetic-portfolio-api
#   2. ln -s /etc/nginx/sites-available/kinetic-portfolio-api /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# Prerequisites:
#   - SSL certificates at paths specified (see ops/ssl-setup.sh)
#   - PM2 running backend on port 3000

upstream kinetic_portfolio_backend {
    # PM2 cluster load balancing handled internally
    server 127.0.0.1:3000;
    
    # Health check and failover
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;
    
    # Let's Encrypt challenge support
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS API server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.your-domain.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS (uncomment after confirming SSL works)
    # add_header Strict-Transport-Security "max-age=63072000" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Request size limits (match Express body parser)
    client_max_body_size 50m;
    
    # Logging
    access_log /var/log/nginx/kinetic-portfolio-api.access.log;
    error_log /var/log/nginx/kinetic-portfolio-api.error.log;
    
    # tRPC API endpoint
    location /api/ {
        proxy_pass http://kinetic_portfolio_backend;
        proxy_http_version 1.1;
        
        # WebSocket support (for future real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Preserve client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Health check endpoint (lightweight, no logging)
    location = /health {
        access_log off;
        proxy_pass http://kinetic_portfolio_backend/api/trpc/system.health?input=%7B%22timestamp%22%3A0%7D;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }
}
