<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Redirects 404 requests back to index.html, preserving the original path.
    (function() {
      var l = window.location;
      var pathname = l.pathname;
      var search = l.search;
      var hash = l.hash;

      // Build redirect URL: index.html? redirect={original full path}
      var redirectPath = pathname + search + hash;
      var redirectUrl = '/?' + encodeURIComponent(redirectPath).replace(/%2F/g, '/').replace(/%3A/g, ':').replace(/%20/g, ' ').replace(/%23/g, '#').replace(/%26/g, '&').replace(/%3D/g, '=').replace(/%3F/g, '?');

      // More robust: just pass the raw path as a single encoded param
      redirectUrl = '/?' + encodeURIComponent(pathname.slice(1) + search + hash);

      window.location.replace(
        l.protocol + '//' + l.hostname +
        (l.port ? ':' + l.port : '') +
        '/' +
        '?redirect=' + encodeURIComponent(pathname.slice(1) + search + hash)
      );
    })();
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
</body>
</html>
