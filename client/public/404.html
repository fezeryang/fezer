<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // GitHub Pages returns this 404.html for any unmatched route.
    // We redirect back to index.html with the original path in a query param.
    // Then index.html uses history.pushState to restore the route — no loop.
    (function() {
      var l = window.location;
      var pathname = l.pathname;   // e.g., /fezer/about
      var search = l.search;       // e.g., ?foo=bar
      var hash = l.hash;           // e.g., #section

      // Extract route after the repo name:
      // pathname.split('/') = ['', 'fezer', 'about'] → parts[2] = 'about'
      var parts = pathname.split('/');
      var route = (parts[2] || '') + search + hash;

      // Build base path: /fezer or /
      var basePath = '/' + (parts[1] || '');

      // Redirect to /fezer/?redirect=about  (or /?redirect= for user pages)
      var redirectUrl = l.protocol + '//' + l.hostname +
        (l.port ? ':' + l.port : '') +
        basePath + '/?redirect=' + encodeURIComponent(route);

      window.location.href = redirectUrl;
    })();
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
</body>
</html>
