<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Redirects 404 requests back to index.html, preserving the original path.
    (function() {
      var l = window.location;
      // pathname like /fezer/about, remove leading slash, keep the rest: about
      var routePath = l.pathname.replace(/^\//, '').replace(/^fezer\//, '');
      var query = l.search;
      var hash = l.hash;
      var fullPath = routePath + query + hash;

      // Redirect to /fezer/?redirect=about  (or /?redirect=about for user pages)
      var base = l.pathname.split('/')[1] || ''; // 'fezer' or ''
      var basePath = base ? '/' + base + '/' : '/';
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath + '?redirect=' + encodeURIComponent(fullPath);

      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
</body>
</html>
