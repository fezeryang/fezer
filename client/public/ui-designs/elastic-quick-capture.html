<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Elastic Quick Capture — Frame Stable</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ececef;
        --bg-deep: #e5e5e9;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --faint: #8e8e93;
        --surface: rgba(250, 250, 252, 0.94);
        --surface-solid: #fbfbfc;
        --surface-hover: #ffffff;
        --surface-soft: rgba(118, 118, 128, 0.085);
        --line: rgba(60, 60, 67, 0.12);
        --separator: rgba(60, 60, 67, 0.12);
        --accent: #007aff;
        --accent-pressed: #0068d8;
        --success: #34c759;
        --danger: #ff3b30;
        --shadow:
          0 16px 40px rgba(18, 18, 22, 0.09), 0 3px 10px rgba(18, 18, 22, 0.055);
        --orb-shadow:
          0 12px 28px rgba(20, 22, 26, 0.1), 0 2px 7px rgba(20, 22, 26, 0.05);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background:
          radial-gradient(
            760px 470px at 17% 9%,
            rgba(255, 255, 255, 0.86),
            transparent 70%
          ),
          radial-gradient(
            680px 440px at 89% 91%,
            rgba(255, 255, 255, 0.52),
            transparent 72%
          ),
          linear-gradient(
            145deg,
            var(--bg) 0%,
            #f3f3f5 48%,
            var(--bg-deep) 100%
          );
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      svg {
        display: block;
      }

      .scene {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 18px;
      }
      .workspace {
        width: min(640px, calc(100vw - 28px));
      }
      .demo-wrap {
        position: relative;
        width: 100%;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hint {
        display: none;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 68px;
        outline: none;
        isolation: isolate;
      }
      .mother {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 68px;
        overflow: visible;
        z-index: 3;
        cursor: default;
        border: 0;
        border-radius: 34px;
        background: transparent;
        contain: layout style;
      }
      .mother-surface {
        position: absolute;
        inset: 0;
        border: 1px solid var(--line);
        border-radius: 34px;
        pointer-events: none;
        z-index: 0;
        transform-origin: left center;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.965),
          rgba(247, 247, 249, 0.915)
        );
        box-shadow:
          var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          inset 0 -1px 0 rgba(0, 0, 0, 0.018);
      }
      .mother-surface::before {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        top: 0;
        height: 1px;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.95) 20%,
          rgba(255, 255, 255, 0.95) 80%,
          transparent
        );
        opacity: 0.95;
        z-index: 5;
      }
      .mother.invalid .mother-surface {
        border-color: rgba(255, 59, 48, 0.34);
      }
      .stage.idle .mother,
      .stage.success .mother {
        cursor: pointer;
      }
      .stage:focus-visible .mother-surface {
        outline: 3px solid rgba(0, 122, 255, 0.22);
        outline-offset: 4px;
      }
      .stage.animating .mother-surface,
      .stage.animating .orb {
        will-change: transform, opacity;
      }

      .state-layer {
        position: absolute;
        inset: 0;
        height: 68px;
        display: flex;
        align-items: center;
        z-index: 1;
      }
      .idle-content {
        z-index: 1;
      }
      .mother-inner {
        width: 100%;
        height: 68px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 13px;
      }
      .core,
      .type-icon,
      .success-icon {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .core {
        color: #fff;
        background: linear-gradient(180deg, #2b2d30, #161719);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.13),
          0 1px 2px rgba(0, 0, 0, 0.13);
        transition:
          transform 140ms cubic-bezier(0.2, 0.8, 0.2, 1),
          filter 140ms ease;
      }
      .stage.idle .mother:active .core {
        transform: scale(0.94);
        filter: brightness(0.96);
      }
      .core svg,
      .type-icon svg,
      .success-icon svg {
        width: 18px;
        height: 18px;
        stroke-width: 1.85;
      }
      .label-space {
        position: relative;
        height: 42px;
        min-width: 0;
        flex: 1;
        display: flex;
        align-items: center;
      }
      .label-item {
        position: absolute;
        left: 0;
        top: 0;
        height: 42px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        white-space: nowrap;
      }
      .label-item b {
        font-size: 15.5px;
        line-height: 19px;
        font-weight: 630;
        letter-spacing: -0.018em;
      }
      .label-item span {
        font-size: 12.5px;
        line-height: 16px;
        color: var(--muted);
        margin-top: 1px;
        letter-spacing: -0.006em;
      }
      .mother-tail {
        width: 30px;
        height: 30px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: var(--faint);
        flex: 0 0 auto;
        transition:
          opacity 140ms ease,
          transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .mother-tail svg {
        width: 15px;
        height: 15px;
        stroke-width: 1.85;
      }
      .stage.expanded .mother-tail,
      .stage.collapsing .mother-tail {
        opacity: 0;
        transform: translateX(-5px) scale(0.92);
      }

      .orb {
        position: absolute;
        top: 2px;
        width: 64px;
        height: 64px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        z-index: 2;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease;
      }
      .orb::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        opacity: 0;
        box-shadow: var(--orb-shadow);
        transform: translateY(-1.5px) scale(1.018);
        transition: opacity 150ms ease;
      }
      .orb.live {
        pointer-events: auto;
      }
      .orb-inner {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: inherit;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        opacity: 0.42;
        border: 1px solid var(--line);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.955),
          rgba(247, 247, 249, 0.9)
        );
        box-shadow:
          0 8px 18px rgba(20, 22, 26, 0.045),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        transform: translateY(0) scale(1);
        transition:
          opacity 150ms ease,
          transform 170ms cubic-bezier(0.2, 0.8, 0.2, 1),
          border-color 160ms ease;
      }
      .orb-inner::before {
        content: "";
        position: absolute;
        left: 11px;
        right: 11px;
        top: 0;
        height: 1px;
        pointer-events: none;
        z-index: 1;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.98),
          transparent
        );
        opacity: 0.9;
      }
      .orb-inner::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.82),
          rgba(255, 255, 255, 0.18)
        );
        transition: opacity 160ms ease;
      }
      .orb:focus-visible {
        outline: none;
      }
      .orb:focus-visible::before {
        opacity: 1;
      }
      .orb:focus-visible .orb-inner {
        outline: 3px solid rgba(0, 122, 255, 0.22);
        outline-offset: 3px;
        opacity: 1;
      }
      .orb:active::before {
        opacity: 0.42;
      }
      .orb:active .orb-inner {
        transform: translateY(0) scale(0.965);
      }
      .orb svg {
        position: relative;
        z-index: 2;
        width: 25px;
        height: 25px;
        stroke-width: 1.55;
      }

      @media (hover: hover) and (pointer: fine) {
        .orb:hover::before,
        .orb.hovered::before {
          opacity: 1;
        }
        .orb:hover .orb-inner,
        .orb.hovered .orb-inner {
          opacity: 1;
          border-color: rgba(60, 60, 67, 0.1);
          transform: translateY(-1.5px) scale(1.018);
        }
        .orb:hover .orb-inner::after,
        .orb.hovered .orb-inner::after {
          opacity: 1;
        }
      }

      .composer-content,
      .success-content {
        opacity: 0;
        transform: translateY(7px);
        pointer-events: none;
        z-index: 2;
      }
      .composer-inner,
      .success-inner {
        width: 100%;
        height: 68px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px 0 16px;
      }
      .type-icon {
        background: var(--surface-soft);
        color: var(--ink);
        border: 1px solid rgba(60, 60, 67, 0.06);
      }
      .capture-input {
        min-width: 0;
        flex: 1;
        height: 44px;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 0 4px;
        font-size: 16px;
        line-height: 22px;
        font-weight: 500;
        letter-spacing: -0.014em;
        color: var(--ink);
        caret-color: var(--accent);
      }
      .capture-input::placeholder {
        color: var(--faint);
        font-weight: 450;
      }
      .composer-actions {
        display: flex;
        align-items: center;
        gap: 3px;
        flex: 0 0 auto;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 15px;
        display: grid;
        place-items: center;
        cursor: pointer;
        background: var(--surface-soft);
        color: var(--muted);
        transition:
          background 140ms ease,
          transform 110ms cubic-bezier(0.2, 0.8, 0.2, 1),
          color 140ms ease,
          box-shadow 140ms ease;
      }
      .icon-btn:focus-visible {
        outline: 3px solid rgba(0, 122, 255, 0.22);
        outline-offset: 2px;
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn.save {
        background: var(--accent);
        color: white;
        box-shadow:
          0 3px 8px rgba(0, 122, 255, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }
      .icon-btn.save:active {
        background: var(--accent-pressed);
        transform: scale(0.94);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        stroke-width: 2;
      }
      @media (hover: hover) and (pointer: fine) {
        .icon-btn:hover {
          background: rgba(118, 118, 128, 0.14);
          color: var(--ink);
        }
        .icon-btn.save:hover {
          background: #0784ff;
          color: white;
          box-shadow:
            0 5px 12px rgba(0, 122, 255, 0.24),
            inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }
      }
      .composer-error {
        position: absolute;
        left: 70px;
        bottom: 3px;
        height: 16px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        line-height: 14px;
        font-weight: 510;
        color: var(--danger);
        opacity: 0;
        transform: translateY(2px);
        transition:
          opacity 140ms ease,
          transform 140ms ease;
        pointer-events: none;
        white-space: nowrap;
      }
      .composer-error::before {
        content: "!";
        width: 13px;
        height: 13px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid currentColor;
        font-size: 9px;
        line-height: 1;
        font-weight: 700;
      }
      .composer-error.show {
        opacity: 1;
        transform: none;
      }

      .success-icon {
        background: var(--success);
        color: white;
        box-shadow:
          0 3px 9px rgba(52, 199, 89, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      .success-copy {
        min-width: 0;
        flex: 1;
      }
      .success-copy b {
        display: block;
        font-size: 15px;
        line-height: 19px;
        font-weight: 630;
        letter-spacing: -0.016em;
      }
      .success-copy span {
        display: block;
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .micro-caption {
        position: absolute;
        bottom: -24px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 11.5px;
        color: var(--faint);
        user-select: none;
        transition: opacity 180ms ease;
      }
      .stage.composing ~ .micro-caption,
      .stage.success ~ .micro-caption {
        opacity: 0.58;
      }

      .inbox {
        margin-top: 20px;
        opacity: 1;
        transition: opacity 220ms ease;
      }
      .inbox-head {
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px;
      }
      .inbox-title {
        font-size: 12px;
        font-weight: 620;
        letter-spacing: -0.004em;
        color: var(--muted);
      }
      .inbox-count {
        font-size: 11.5px;
        color: var(--faint);
      }
      .inbox-list {
        border-top: 1px solid var(--separator);
      }
      .empty {
        height: 60px;
        display: flex;
        align-items: center;
        padding: 0 4px;
        color: var(--faint);
        font-size: 13px;
      }
      .item {
        min-height: 62px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid var(--separator);
        animation: itemIn 300ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes itemIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .item-type {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: var(--surface-soft);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        color: var(--ink);
      }
      .item-type svg {
        width: 16px;
        height: 16px;
        stroke-width: 1.7;
      }
      .task-check {
        position: relative;
        width: 44px;
        height: 44px;
        border: 0;
        background: transparent;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
        flex: 0 0 auto;
      }
      .task-check::before {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border: 1.5px solid rgba(60, 60, 67, 0.3);
        border-radius: 50%;
        background: transparent;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          transform 110ms ease;
      }
      .task-check:active::before {
        transform: scale(0.9);
      }
      .task-check svg {
        position: relative;
        width: 12px;
        height: 12px;
        opacity: 0;
        color: white;
        stroke-width: 2.3;
        z-index: 1;
      }
      .task-check:focus-visible {
        outline: 3px solid rgba(0, 122, 255, 0.22);
        outline-offset: -4px;
        border-radius: 14px;
      }
      .item.done .task-check::before {
        background: var(--accent);
        border-color: var(--accent);
      }
      .item.done .task-check svg {
        opacity: 1;
      }
      .item-main {
        min-width: 0;
        flex: 1;
      }
      .item-text {
        display: block;
        font-size: 14px;
        line-height: 19px;
        font-weight: 520;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-decoration-thickness: 1px;
        text-decoration-color: rgba(60, 60, 67, 0.34);
      }
      .item.done .item-text {
        text-decoration: line-through;
        color: var(--faint);
      }
      .item-meta {
        display: block;
        margin-top: 1px;
        font-size: 11.5px;
        line-height: 15px;
        color: var(--faint);
      }
      .item-link {
        color: inherit;
        text-decoration: none;
      }
      .item-link:focus-visible {
        outline: 2px solid rgba(0, 122, 255, 0.3);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .delete-btn {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: var(--faint);
        display: grid;
        place-items: center;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 140ms ease,
          background 140ms ease,
          color 140ms ease,
          transform 110ms ease;
        flex: 0 0 auto;
      }
      .delete-btn:focus-visible {
        opacity: 1;
        outline: 3px solid rgba(0, 122, 255, 0.22);
        outline-offset: -4px;
      }
      .delete-btn:active {
        transform: scale(0.94);
      }
      .delete-btn svg {
        width: 14px;
        height: 14px;
        stroke-width: 1.9;
      }
      @media (hover: hover) and (pointer: fine) {
        .item:hover .delete-btn {
          opacity: 1;
        }
        .delete-btn:hover {
          background: var(--surface-soft);
          color: var(--ink);
        }
        .item-link:hover {
          text-decoration: underline;
          text-underline-offset: 3px;
          text-decoration-color: rgba(60, 60, 67, 0.35);
        }
      }

      @media (max-width: 680px) {
        .scene {
          padding: 34px 10px;
        }
        .workspace {
          width: calc(100vw - 20px);
        }
        .mother-inner {
          padding-inline: 16px;
        }
        .label-item b {
          font-size: 15px;
        }
        .label-item span {
          font-size: 12px;
        }
        .orb,
        .orb-inner {
          width: 56px;
          height: 56px;
        }
        .orb {
          top: 6px;
        }
        .orb svg {
          width: 23px;
          height: 23px;
        }
        .composer-inner {
          padding-left: 12px;
          padding-right: 7px;
          gap: 6px;
        }
        .type-icon {
          width: 38px;
          height: 38px;
          border-radius: 13px;
        }
        .capture-input {
          font-size: 16px;
        }
        .icon-btn {
          width: 44px;
          height: 44px;
          border-radius: 14px;
        }
        .delete-btn {
          opacity: 0.64;
        }
        .micro-caption {
          font-size: 11px;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19191b;
          --bg-deep: #111113;
          --ink: #f5f5f7;
          --muted: #a1a1a6;
          --faint: #77777d;
          --surface: rgba(42, 42, 45, 0.94);
          --surface-solid: #2a2a2d;
          --surface-hover: #333336;
          --surface-soft: rgba(118, 118, 128, 0.16);
          --line: rgba(235, 235, 245, 0.12);
          --separator: rgba(84, 84, 88, 0.52);
          --accent: #0a84ff;
          --accent-pressed: #0070df;
          --success: #30d158;
          --danger: #ff453a;
          --shadow:
            0 18px 44px rgba(0, 0, 0, 0.28), 0 3px 10px rgba(0, 0, 0, 0.2);
          --orb-shadow:
            0 14px 30px rgba(0, 0, 0, 0.28), 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        body {
          background:
            radial-gradient(
              760px 470px at 17% 9%,
              rgba(82, 82, 88, 0.22),
              transparent 70%
            ),
            radial-gradient(
              680px 440px at 89% 91%,
              rgba(64, 64, 70, 0.18),
              transparent 72%
            ),
            linear-gradient(145deg, var(--bg), #202023 48%, var(--bg-deep));
        }
        .mother-surface,
        .orb-inner {
          background: linear-gradient(
            180deg,
            rgba(49, 49, 52, 0.97),
            rgba(36, 36, 39, 0.94)
          );
          box-shadow:
            var(--shadow),
            inset 0 1px 0 rgba(255, 255, 255, 0.08),
            inset 0 -1px 0 rgba(0, 0, 0, 0.16);
        }
        .mother-surface::before,
        .orb-inner::before {
          opacity: 0.2;
        }
        .core {
          background: linear-gradient(180deg, #4a4a4f, #29292d);
        }
        .orb-inner::after {
          background: linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.08),
            rgba(255, 255, 255, 0.02)
          );
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .mother-surface,
        .orb-inner {
          background: var(--surface-solid) !important;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .orb-inner,
        .icon-btn,
        .mother-tail,
        .task-check::before,
        .delete-btn {
          transition-duration: 100ms !important;
        }
        .label-item {
          filter: none !important;
        }
        .item {
          animation: itemFade 120ms ease-out both;
        }
        @keyframes itemFade {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <main class="workspace">
        <div class="demo-wrap" id="demoWrap">
          <div class="hint"></div>
          <div
            class="stage idle"
            id="stage"
            tabindex="0"
            role="group"
            aria-label="Quick capture"
          >
            <div class="mother" id="mother">
              <div
                class="mother-surface"
                id="motherSurface"
                aria-hidden="true"
              ></div>
              <div class="state-layer idle-content" id="idleContent">
                <div class="mother-inner">
                  <div class="core" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 5v14M5 12h14" />
                    </svg>
                  </div>
                  <div class="label-space" id="labelSpace">
                    <div class="label-item" data-title="Quick capture">
                      <b>Quick capture</b><span>Task, note, or link</span>
                    </div>
                  </div>
                  <div class="mother-tail" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="m9 18 6-6-6-6" />
                    </svg>
                  </div>
                </div>
              </div>

              <form
                class="state-layer composer-content"
                id="composer"
                autocomplete="off"
              >
                <div class="composer-inner">
                  <div class="type-icon" id="typeIcon" aria-hidden="true"></div>
                  <input
                    class="capture-input"
                    id="captureInput"
                    type="text"
                    maxlength="240"
                  />
                  <div class="composer-actions">
                    <button
                      class="icon-btn"
                      id="cancelBtn"
                      type="button"
                      aria-label="Cancel"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                      >
                        <path d="M6 6l12 12M18 6 6 18" />
                      </svg>
                    </button>
                    <button
                      class="icon-btn save"
                      id="saveBtn"
                      type="submit"
                      aria-label="Save"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="m5 12 4 4L19 7" />
                      </svg>
                    </button>
                  </div>
                </div>
                <div
                  class="composer-error"
                  id="composerError"
                  role="status"
                ></div>
              </form>

              <div
                class="state-layer success-content"
                id="successContent"
                aria-live="polite"
              >
                <div class="success-inner">
                  <div class="success-icon">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="m5 12 4 4L19 7" />
                    </svg>
                  </div>
                  <div class="success-copy">
                    <b>Saved</b><span id="successText"></span>
                  </div>
                </div>
              </div>
            </div>

            <button class="orb" data-index="0" aria-label="New task">
              <span class="orb-inner"></span>
            </button>
            <button class="orb" data-index="1" aria-label="New note">
              <span class="orb-inner"></span>
            </button>
            <button class="orb" data-index="2" aria-label="Save link">
              <span class="orb-inner"></span>
            </button>
          </div>
          <div class="micro-caption" id="microCaption">
            Capture without leaving your flow
          </div>
        </div>

        <section class="inbox" aria-label="Capture inbox">
          <div class="inbox-head">
            <span class="inbox-title">Inbox</span
            ><span class="inbox-count" id="inboxCount">0 items</span>
          </div>
          <div class="inbox-list" id="inboxList"></div>
        </section>
      </main>
    </div>
    <script>
      (() => {
        const stage = document.getElementById("stage");
        const mother = document.getElementById("mother");
        const motherSurface = document.getElementById("motherSurface");
        const demoWrap = document.getElementById("demoWrap");
        const labelSpace = document.getElementById("labelSpace");
        const idleContent = document.getElementById("idleContent");
        const composer = document.getElementById("composer");
        const captureInput = document.getElementById("captureInput");
        const typeIcon = document.getElementById("typeIcon");
        const cancelBtn = document.getElementById("cancelBtn");
        const composerError = document.getElementById("composerError");
        const successContent = document.getElementById("successContent");
        const successText = document.getElementById("successText");
        const inboxList = document.getElementById("inboxList");
        const inboxCount = document.getElementById("inboxCount");
        const orbs = [...document.querySelectorAll(".orb")];
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

        const actions = [
          {
            type: "task",
            label: "Add Task",
            sub: "Something to get done",
            placeholder: "What needs to get done?",
            icon: icon("checkcircle"),
          },
          {
            type: "note",
            label: "New Note",
            sub: "Capture a thought",
            placeholder: "Write a quick note…",
            icon: icon("note"),
          },
          {
            type: "link",
            label: "Save Link",
            sub: "Keep a URL for later",
            placeholder: "Paste or type a URL…",
            icon: icon("link"),
          },
        ];
        // pi-lens-ignore: ast-grep:no-inner-html-js
        orbs.forEach(
          (orb, i) =>
            (orb.querySelector(".orb-inner").innerHTML = actions[i].icon)
        );

        let mode = "idle";
        let expanded = false;
        let pointerInside = false;
        let currentAction = null;
        let seq = 0;
        let labelSeq = 0;
        let successTask = null;
        const orbVisible = [false, false, false];

        const geom = {
          width: 640,
          full: 640,
          compact: 400,
          button: 64,
          gap: 16,
          baseX: [416, 496, 576],
          enterX: [352, 368, 384],
          exitX: [576, 576, 576],
        };
        const LAYOUT_K = 323.5894917400647,
          LAYOUT_D = 28.781749405735674;
        const ORB_K = 126.40214521096279,
          ORB_D = 17.988593378584795;

        // Closed-form damped springs. Position and velocity are exact for each dt,
        // so changing display refresh rate doesn't alter the physical trajectory.
        function makeSpring(x, k, d, restDelta, restSpeed) {
          return {
            x,
            v: 0,
            target: x,
            k,
            d,
            m: 1,
            restDelta,
            restSpeed,
            active: false,
            onRest: null,
          };
        }
        const springs = {
          width: makeSpring(640, LAYOUT_K, LAYOUT_D, 0.08, 1.2),
          x: [0, 1, 2].map(() => makeSpring(576, ORB_K, ORB_D, 0.06, 0.9)),
          scale: [0, 1, 2].map(() =>
            makeSpring(0.7, ORB_K, ORB_D, 0.00045, 0.008)
          ),
        };
        const applied = {
          surfaceScale: NaN,
          x: [NaN, NaN, NaN],
          scale: [NaN, NaN, NaN],
        };
        let motherLayoutWidth = 640;

        function springStep(s, dt) {
          if (!s.active || dt <= 0) return;
          if (reduced) {
            finishSpring(s);
            return;
          }
          dt = Math.min(dt, 5);
          const y0 = s.x - s.target,
            v0 = s.v;
          const w0 = Math.sqrt(s.k / s.m);
          const z = s.d / (2 * Math.sqrt(s.k * s.m));
          let y, v;
          if (z < 1 - 1e-5) {
            const a = z * w0,
              wd = w0 * Math.sqrt(1 - z * z),
              e = Math.exp(-a * dt);
            const c = Math.cos(wd * dt),
              sn = Math.sin(wd * dt);
            const B = (v0 + a * y0) / wd;
            y = e * (y0 * c + B * sn);
            v = e * (-y0 * wd * sn + B * wd * c - a * (y0 * c + B * sn));
          } else if (z > 1 + 1e-5) {
            const q = Math.sqrt(z * z - 1),
              r1 = -w0 * (z - q),
              r2 = -w0 * (z + q);
            const c1 = (v0 - r2 * y0) / (r1 - r2),
              c2 = y0 - c1;
            const e1 = Math.exp(r1 * dt),
              e2 = Math.exp(r2 * dt);
            y = c1 * e1 + c2 * e2;
            v = c1 * r1 * e1 + c2 * r2 * e2;
          } else {
            const e = Math.exp(-w0 * dt),
              C = v0 + w0 * y0;
            y = e * (y0 + C * dt);
            v = e * (v0 - w0 * C * dt);
          }
          s.x = s.target + y;
          s.v = v;
          if (
            Math.abs(s.target - s.x) <= s.restDelta &&
            Math.abs(s.v) <= s.restSpeed
          )
            finishSpring(s);
        }
        function finishSpring(s) {
          const cb = s.onRest;
          s.x = s.target;
          s.v = 0;
          s.active = false;
          s.onRest = null;
          if (cb) queueMicrotask(cb);
        }
        function retarget(s, value, onRest = null) {
          s.target = value;
          s.onRest = onRest;
          if (reduced) {
            finishSpring(s);
            applyMotion(true);
            return;
          }
          if (
            Math.abs(s.x - value) <= s.restDelta &&
            Math.abs(s.v) <= s.restSpeed
          ) {
            finishSpring(s);
            applyMotion(true);
            return;
          }
          s.active = true;
          ensureFrame();
        }
        function jump(s, value) {
          s.x = s.target = value;
          s.v = 0;
          s.active = false;
          s.onRest = null;
        }

        // One animation clock owns both spring updates and stagger/timeline events.
        // Tasks execute at their intended timestamp inside the same integration interval,
        // so a busy frame doesn't collapse 50ms stagger steps into one visual state.
        let raf = 0,
          last = performance.now(),
          tasks = [],
          taskId = 0,
          wakeTimer = 0;
        const perf = { frames: 0, maxDelta: 0, over16: 0, over8: 0 };
        window.__quickCapturePerf = perf;

        function schedule(delay, fn) {
          const t = {
            id: ++taskId,
            at: performance.now() + Math.max(0, delay),
            fn,
            cancelled: false,
          };
          tasks.push(t);
          tasks.sort((a, b) => a.at - b.at);
          if (raf || hasActiveSpring()) ensureFrame();
          else armWake();
          return t;
        }
        function cancelTask(t) {
          if (t) {
            t.cancelled = true;
            armWake();
          }
        }
        function compactTasks() {
          while (tasks.length && tasks[0].cancelled) tasks.shift();
        }
        function armWake() {
          if (raf) return;
          compactTasks();
          if (wakeTimer) {
            clearTimeout(wakeTimer);
            wakeTimer = 0;
          }
          if (!tasks.length) return;
          const at = tasks[0].at;
          wakeTimer = setTimeout(
            () => {
              wakeTimer = 0;
              ensureFrame(at);
            },
            Math.max(0, at - performance.now() - 2)
          );
        }
        function advanceAll(dt) {
          if (dt <= 0) return;
          springStep(springs.width, dt);
          for (let i = 0; i < 3; i++) {
            springStep(springs.x[i], dt);
            springStep(springs.scale[i], dt);
          }
        }
        function hasActiveSpring() {
          return (
            springs.width.active ||
            springs.x.some(s => s.active) ||
            springs.scale.some(s => s.active)
          );
        }
        function tick(now) {
          const frameDelta = now - last;
          perf.frames++;
          perf.maxDelta = Math.max(perf.maxDelta, frameDelta);
          if (frameDelta > 16.8) perf.over16++;
          if (frameDelta > 8.6) perf.over8++;
          let cursor = last;
          while (tasks.length && tasks[0].at <= now) {
            const t = tasks.shift();
            const eventTime = Math.max(cursor, t.at);
            advanceAll((eventTime - cursor) / 1000);
            cursor = eventTime;
            if (!t.cancelled) t.fn();
          }
          advanceAll((now - cursor) / 1000);
          last = now;
          applyMotion(false);
          if (hasActiveSpring()) raf = requestAnimationFrame(tick);
          else {
            applyMotion(true);
            raf = 0;
            stage.classList.remove("animating");
            armWake();
          }
        }
        function ensureFrame(startTime = performance.now()) {
          if (wakeTimer) {
            clearTimeout(wakeTimer);
            wakeTimer = 0;
          }
          stage.classList.add("animating");
          if (!raf) {
            last = startTime;
            raf = requestAnimationFrame(tick);
          }
        }
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) last = performance.now();
        });

        function setMotherLayoutWidth(px) {
          motherLayoutWidth = px;
          mother.style.width = `${px}px`;
        }
        function applyMotion(force = false) {
          const surfaceScale = motherLayoutWidth
            ? springs.width.x / motherLayoutWidth
            : 1;
          if (
            force ||
            !Number.isFinite(applied.surfaceScale) ||
            Math.abs(applied.surfaceScale - surfaceScale) > 0.00035
          ) {
            applied.surfaceScale = surfaceScale;
            motherSurface.style.transform = `scaleX(${surfaceScale.toFixed(6)})`;
          }
          orbs.forEach((orb, i) => {
            const x = springs.x[i].x,
              sc = springs.scale[i].x;
            if (
              force ||
              !Number.isFinite(applied.x[i]) ||
              Math.abs(applied.x[i] - x) > 0.015 ||
              Math.abs(applied.scale[i] - sc) > 0.00025
            ) {
              applied.x[i] = x;
              applied.scale[i] = sc;
              orb.style.transform = `translate3d(${x.toFixed(3)}px,0,0) scale(${sc.toFixed(5)})`;
            }
          });
        }

        function recompute() {
          const w = Math.max(300, Math.min(640, innerWidth - 28));
          const button = innerWidth <= 680 ? 56 : 64;
          const gap = innerWidth <= 680 ? 10 : 16;
          const rail = button * 3 + gap * 3;
          geom.width = w;
          geom.full = w;
          geom.compact = Math.max(250, w - rail);
          geom.button = button;
          geom.gap = gap;
          geom.baseX = [0, 1, 2].map(
            i => geom.compact + gap + i * (button + gap)
          );
          geom.enterX = [0, 1, 2].map(i => geom.baseX[i] - button * (i + 1));
          geom.exitX = [0, 1, 2].map(() => geom.baseX[2]);
          if (!expanded) {
            jump(springs.width, geom.full);
            setMotherLayoutWidth(geom.full);
          }
          if (!expanded) {
            orbs.forEach((o, i) => {
              jump(springs.x[i], geom.exitX[i]);
              jump(springs.scale[i], 0.7);
              orbVisible[i] = false;
              o.style.opacity = "0";
              o.classList.remove("live");
              applied.x[i] = NaN;
              applied.scale[i] = NaN;
            });
          }
          applyMotion(true);
        }
        addEventListener("resize", recompute, { passive: true });

        function setLabel(title, sub, instant = false) {
          const token = ++labelSeq;
          const old = labelSpace.querySelector(".label-item:last-child");
          // pi-lens-ignore: ast-grep:no-inner-html-js
          if (instant || reduced || (old && old.dataset.title === title)) {
            labelSpace.innerHTML = labelMarkup(title, sub);
            return;
          }
          // pi-lens-ignore: ast-grep:no-inner-html-js
          const next = document.createElement("div");
          next.className = "label-item";
          next.dataset.title = title;
          next.innerHTML = `<b>${escapeHTML(title)}</b><span>${escapeHTML(sub)}</span>`;
          next.style.opacity = "0";
          next.style.transform = "translateY(9px)";
          next.style.filter = "blur(4px)";
          labelSpace.appendChild(next);
          const oldAnim = old?.animate(
            [
              { opacity: 1, transform: "translateY(0)", filter: "blur(0px)" },
              {
                opacity: 0,
                transform: "translateY(-9px)",
                filter: "blur(4px)",
              },
            ],
            { duration: 190, easing: "ease-out", fill: "forwards" }
          );
          const nextAnim = next.animate(
            [
              { opacity: 0, transform: "translateY(9px)", filter: "blur(4px)" },
              { opacity: 1, transform: "translateY(0)", filter: "blur(0px)" },
            ],
            { duration: 190, easing: "ease-out", fill: "forwards" }
          );
          Promise.allSettled(
            [oldAnim?.finished, nextAnim.finished].filter(Boolean)
          ).then(() => {
            if (token !== labelSeq) return;
            [...labelSpace.querySelectorAll(".label-item")].forEach(el => {
              if (el !== next) el.remove();
            });
            next.removeAttribute("style");
          });
        }
        function labelMarkup(title, sub) {
          return `<div class="label-item" data-title="${escapeHTML(title)}"><b>${escapeHTML(title)}</b><span>${escapeHTML(sub)}</span></div>`;
        }

        function showOrb(i) {
          if (!orbVisible[i]) {
            orbVisible[i] = true;
            orbs[i].style.opacity = "1";
          }
          orbs[i].classList.add("live");
        }
        function hideOrb(i) {
          orbVisible[i] = false;
          orbs[i].style.opacity = "0";
          orbs[i].classList.remove("live");
        }

        function expand() {
          if (mode !== "idle" || expanded) return;
          expanded = true;
          stage.classList.add("expanded");
          stage.classList.remove("collapsing");
          demoWrap.classList.add("engaged");
          const token = ++seq;
          // One real layout change; the visible shell keeps its old visual width via transform.
          setMotherLayoutWidth(geom.compact);
          retarget(springs.width, geom.compact);
          orbs.forEach((orb, i) => {
            if (!orbVisible[i]) {
              jump(springs.x[i], geom.enterX[i]);
              jump(springs.scale[i], 0.7);
              showOrb(i);
            }
            schedule(reduced ? 0 : i * 50, () => {
              if (token !== seq || !expanded || mode !== "idle") return;
              retarget(springs.x[i], geom.baseX[i]);
              retarget(springs.scale[i], 1);
            });
          });
          applyMotion(true);
        }

        function collapse({ forSelection = false } = {}) {
          if (!expanded && !forSelection) return;
          expanded = false;
          stage.classList.remove("expanded");
          stage.classList.add("collapsing");
          const token = ++seq;
          setMotherLayoutWidth(geom.full);
          retarget(springs.width, geom.full, () => {
            if (!expanded) stage.classList.remove("collapsing");
          });
          orbs.forEach(o => o.classList.remove("hovered", "live"));
          if (!forSelection) setLabel("Quick capture", "Task, note, or link");
          orbs.forEach((orb, i) => {
            schedule(reduced ? 0 : i * 45, () => {
              if (token !== seq || expanded) return;
              retarget(springs.x[i], geom.exitX[i]);
              retarget(springs.scale[i], 0.7);
            });
            schedule(reduced ? 0 : 800 + i * 45, () => {
              if (token === seq && !expanded) hideOrb(i);
            });
          });
          applyMotion(true);
        }

        function choose(index) {
          if (mode !== "idle" || !expanded) return;
          currentAction = actions[index];
          mode = "composer";
          stage.className = "stage composing collapsing animating";
          demoWrap.classList.add("engaged");
          collapse({ forSelection: true });
          setLabel(currentAction.label, currentAction.sub);
          cancelTask(successTask);
          composerError.classList.remove("show");
          captureInput.removeAttribute("aria-invalid");
          mother.classList.remove("invalid");
          const token = seq;
          schedule(reduced ? 0 : 310, () => {
            if (mode !== "composer" || token !== seq) return;
            // pi-lens-ignore: ast-grep:no-inner-html-js
            typeIcon.innerHTML = currentAction.icon;
            captureInput.value = "";
            captureInput.placeholder = currentAction.placeholder;
            captureInput.inputMode =
              currentAction.type === "link" ? "url" : "text";
            idleContent.animate(
              [
                { opacity: 1, transform: "translateY(0)" },
                { opacity: 0, transform: "translateY(-6px)" },
              ],
              {
                duration: reduced ? 100 : 160,
                easing: "ease-out",
                fill: "forwards",
              }
            );
            const a = composer.animate(
              [
                { opacity: 0, transform: "translateY(7px)" },
                { opacity: 1, transform: "translateY(0)" },
              ],
              {
                duration: reduced ? 120 : 235,
                easing: "cubic-bezier(.16,1,.3,1)",
                fill: "forwards",
              }
            );
            composer.style.pointerEvents = "auto";
            a.onfinish = () => {
              if (mode === "composer") {
                captureInput.focus({ preventScroll: true });
                captureInput.select();
              }
            };
          });
        }

        function cancelComposer() {
          if (mode !== "composer") return;
          ++seq;
          mode = "idle";
          currentAction = null;
          stage.className = "stage idle";
          composer.style.pointerEvents = "none";
          composerError.classList.remove("show");
          captureInput.removeAttribute("aria-invalid");
          mother.classList.remove("invalid");
          composer.animate(
            [
              { opacity: 1, transform: "translateY(0)" },
              { opacity: 0, transform: "translateY(6px)" },
            ],
            {
              duration: reduced ? 100 : 145,
              easing: "ease-in",
              fill: "forwards",
            }
          );
          idleContent.animate(
            [
              { opacity: 0, transform: "translateY(6px)" },
              { opacity: 1, transform: "translateY(0)" },
            ],
            {
              duration: reduced ? 120 : 220,
              delay: reduced ? 0 : 45,
              easing: "cubic-bezier(.16,1,.3,1)",
              fill: "forwards",
            }
          );
          setLabel("Quick capture", "Task, note, or link", true);
          demoWrap.classList.remove("engaged");
          setMotherLayoutWidth(geom.full);
          retarget(springs.width, geom.full);
          applyMotion(true);
        }

        function normalizeLink(value) {
          let raw = value.trim();
          if (!raw || /\s/.test(raw)) return null;
          if (!/^[a-zA-Z][a-zA-Z\d+.-]*:\/\//.test(raw)) raw = "https://" + raw;
          try {
            const u = new URL(raw);
            if (!["http:", "https:"].includes(u.protocol)) return null;
            const host = u.hostname.toLowerCase();
            if (!host || (!host.includes(".") && host !== "localhost"))
              return null;
            return u.href;
          } catch {
            return null;
          }
        }

        function submitCapture() {
          if (mode !== "composer" || !currentAction) return;
          let value = captureInput.value.trim();
          if (!value) {
            showError(
              currentAction.type === "link"
                ? "Enter a URL"
                : "Write something first"
            );
            return;
          }
          if (currentAction.type === "link") {
            const url = normalizeLink(value);
            if (!url) {
              showError("Enter a valid web address");
              return;
            }
            value = url;
          }
          composerError.classList.remove("show");
          captureInput.removeAttribute("aria-invalid");
          mother.classList.remove("invalid");
          const item = {
            id:
              crypto.randomUUID?.() ||
              String(Date.now()) + Math.random().toString(16).slice(2),
            type: currentAction.type,
            text: value,
            createdAt: Date.now(),
            done: false,
          };
          // Critical path first: visual acknowledgement now. Storage/Inbox work is deferred until after a paint opportunity.
          items.unshift(item);
          items = items.slice(0, 12);
          showSuccess(item);
          deferNonCritical(() => {
            persist();
            renderInbox(item.id);
          });
        }
        function deferNonCritical(fn) {
          requestAnimationFrame(() => {
            setTimeout(fn, 0);
          });
        }
        function showError(message) {
          composerError.textContent = message;
          composerError.classList.add("show");
          captureInput.setAttribute("aria-invalid", "true");
          mother.classList.add("invalid");
          captureInput.animate(
            [
              { transform: "translateX(0)" },
              { transform: "translateX(-2px)" },
              { transform: "translateX(2px)" },
              { transform: "translateX(0)" },
            ],
            { duration: reduced ? 100 : 140, easing: "ease-out" }
          );
        }

        function showSuccess(item) {
          mode = "success";
          stage.className = "stage success";
          composer.style.pointerEvents = "none";
          successText.textContent = displayText(item);
          composer.animate(
            [
              { opacity: 1, transform: "translateY(0)" },
              { opacity: 0, transform: "translateY(-6px)" },
            ],
            {
              duration: reduced ? 100 : 145,
              easing: "ease-out",
              fill: "forwards",
            }
          );
          successContent.animate(
            [
              { opacity: 0, transform: "translateY(7px)" },
              { opacity: 1, transform: "translateY(0)" },
            ],
            {
              duration: reduced ? 120 : 230,
              delay: reduced ? 0 : 40,
              easing: "cubic-bezier(.16,1,.3,1)",
              fill: "forwards",
            }
          );
          cancelTask(successTask);
          successTask = schedule(reduced ? 350 : 820, () =>
            resetAfterSuccess(false)
          );
        }
        function resetAfterSuccess(reopen = false) {
          if (mode !== "success") return;
          cancelTask(successTask);
          successTask = null;
          ++seq;
          mode = "idle";
          currentAction = null;
          stage.className = "stage idle";
          successContent.animate(
            [
              { opacity: 1, transform: "translateY(0)" },
              { opacity: 0, transform: "translateY(-4px)" },
            ],
            {
              duration: reduced ? 100 : 135,
              easing: "ease-in",
              fill: "forwards",
            }
          );
          idleContent.animate(
            [
              { opacity: 0, transform: "translateY(5px)" },
              { opacity: 1, transform: "translateY(0)" },
            ],
            {
              duration: reduced ? 120 : 210,
              delay: reduced ? 0 : 35,
              easing: "cubic-bezier(.16,1,.3,1)",
              fill: "forwards",
            }
          );
          setLabel("Quick capture", "Task, note, or link", true);
          demoWrap.classList.remove("engaged");
          if (reopen)
            schedule(reduced ? 80 : 120, () => {
              if (mode === "idle") expand();
            });
        }

        const STORAGE_KEY = "elastic-quick-capture-v1";
        let items = loadItems();
        function loadItems() {
          try {
            const x = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            return Array.isArray(x) ? x.slice(0, 12) : [];
          } catch {
            return [];
          }
        }
        function persist() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
          } catch {}
        }
        function renderInbox(newId = "") {
          inboxCount.textContent = `${items.length} ${items.length === 1 ? "item" : "items"}`;
          if (!items.length) {
            inboxList.innerHTML =
              '<div class="empty">Tasks, notes, and links you save will appear here.</div>';
            return;
          }
          // pi-lens-ignore: ast-grep:no-inner-html-js
          inboxList.innerHTML = items
            .slice(0, 6)
            .map(item => itemMarkup(item, item.id === newId))
            .join("");
        }
        function itemMarkup(item, isNew) {
          const safeId = escapeHTML(item.id),
            safeText = escapeHTML(displayText(item));
          const age = formatAge(item.createdAt);
          const done = item.done ? " done" : "";
          let leading = "";
          if (item.type === "task")
            leading = `<button class="task-check" data-toggle="${safeId}" aria-label="${item.done ? "Mark incomplete" : "Mark complete"}">${icon("check")}</button>`;
          else
            leading = `<span class="item-type">${item.type === "note" ? icon("note") : icon("link")}</span>`;
          const text =
            item.type === "link"
              ? `<a class="item-text item-link" href="${escapeAttr(item.text)}" target="_blank" rel="noopener noreferrer">${safeText}</a>`
              : `<span class="item-text">${safeText}</span>`;
          return `<div class="item${done}" data-id="${safeId}"${isNew ? ' data-new="true"' : ""}>${leading}<div class="item-main">${text}<span class="item-meta">${escapeHTML(typeLabel(item.type))} · ${age}</span></div><button class="delete-btn" data-delete="${safeId}" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`;
        }
        function displayText(item) {
          if (item.type !== "link") return item.text;
          try {
            const u = new URL(item.text);
            return (
              u.hostname.replace(/^www\./, "") +
              (u.pathname && u.pathname !== "/" ? u.pathname : "")
            );
          } catch {
            return item.text;
          }
        }
        function typeLabel(type) {
          return type === "task" ? "Task" : type === "note" ? "Note" : "Link";
        }
        function formatAge(ts) {
          const s = Math.max(
            0,
            Math.floor((Date.now() - Number(ts || 0)) / 1000)
          );
          if (s < 60) return "just now";
          const m = Math.floor(s / 60);
          if (m < 60) return `${m}m ago`;
          const h = Math.floor(m / 60);
          if (h < 24) return `${h}h ago`;
          return new Date(ts).toLocaleDateString(undefined, {
            month: "short",
            day: "numeric",
          });
        }

        inboxList.addEventListener("click", e => {
          const toggle = e.target.closest?.("[data-toggle]");
          if (toggle) {
            const id = toggle.dataset.toggle;
            const item = items.find(x => x.id === id);
            if (item) {
              item.done = !item.done;
              renderInbox();
              deferNonCritical(persist);
            }
            return;
          }
          const del = e.target.closest?.("[data-delete]");
          if (del) {
            items = items.filter(x => x.id !== del.dataset.delete);
            renderInbox();
            deferNonCritical(persist);
          }
        });

        stage.addEventListener("pointerenter", () => {
          pointerInside = true;
          if (mode === "idle") expand();
        });
        stage.addEventListener("pointerleave", () => {
          pointerInside = false;
          if (mode === "idle") collapse();
        });
        stage.addEventListener("focus", e => {
          if (e.target === stage && mode === "idle") expand();
        });
        stage.addEventListener("blur", e => {
          if (mode === "idle" && !stage.contains(e.relatedTarget)) {
            pointerInside = false;
            collapse();
          }
        });
        mother.addEventListener("click", () => {
          if (mode === "idle") {
            expanded ? collapse() : expand();
          } else if (mode === "success") {
            resetAfterSuccess(true);
          }
        });

        orbs.forEach((orb, i) => {
          orb.addEventListener("pointerenter", () => {
            if (mode !== "idle") return;
            orbs.forEach((o, j) => o.classList.toggle("hovered", j === i));
            setLabel(actions[i].label, actions[i].sub);
          });
          orb.addEventListener("focus", () => {
            if (mode !== "idle") return;
            orbs.forEach((o, j) => o.classList.toggle("hovered", j === i));
            setLabel(actions[i].label, actions[i].sub);
          });
          orb.addEventListener("click", e => {
            e.stopPropagation();
            choose(i);
          });
        });
        composer.addEventListener("submit", e => {
          e.preventDefault();
          submitCapture();
        });
        cancelBtn.addEventListener("click", e => {
          e.stopPropagation();
          cancelComposer();
        });
        captureInput.addEventListener("input", () => {
          composerError.classList.remove("show");
          captureInput.removeAttribute("aria-invalid");
          mother.classList.remove("invalid");
        });
        captureInput.addEventListener("keydown", e => {
          if (e.key === "Escape") {
            e.preventDefault();
            cancelComposer();
          }
        });
        stage.addEventListener("keydown", e => {
          if (e.key === "Escape" && mode === "idle") {
            e.preventDefault();
            collapse();
          }
          if (
            (e.key === "Enter" || e.key === " ") &&
            mode === "idle" &&
            !expanded
          ) {
            e.preventDefault();
            expand();
          } else if (
            (e.key === "Enter" || e.key === " ") &&
            mode === "success"
          ) {
            e.preventDefault();
            resetAfterSuccess(true);
          }
        });

        function escapeHTML(v) {
          return String(v).replace(
            /[&<>'"]/g,
            ch =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;",
              })[ch]
          );
        }
        function escapeAttr(v) {
          return escapeHTML(v);
        }
        function icon(name) {
          const c =
            'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
          return (
            {
              checkcircle: `<svg ${c}><circle cx="12" cy="12" r="8.5"/><path d="m8.4 12 2.2 2.2 5-5"/></svg>`,
              note: `<svg ${c}><path d="M6 4.5h9l3 3v12H6z"/><path d="M15 4.5v3h3M9 11h6M9 14.5h5"/></svg>`,
              link: `<svg ${c}><path d="M10.2 13.8a4.2 4.2 0 0 0 5.9 0l2.2-2.2a4.2 4.2 0 0 0-5.9-5.9l-1.3 1.3"/><path d="M13.8 10.2a4.2 4.2 0 0 0-5.9 0l-2.2 2.2a4.2 4.2 0 0 0 5.9 5.9l1.3-1.3"/></svg>`,
              check: `<svg ${c}><path d="m6.8 12.2 3.2 3.2 7.2-7.2"/></svg>`,
            }[name] || ""
          );
        }

        recompute();
        setMotherLayoutWidth(geom.full);
        jump(springs.width, geom.full);
        orbs.forEach((o, i) => {
          jump(springs.x[i], geom.exitX[i]);
          jump(springs.scale[i], 0.7);
          hideOrb(i);
        });
        applyMotion(true);
        renderInbox();
      })();
    </script>
  </body>
</html>
