<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ObsidianUI Apple Spotlight — Smooth Performance Edition</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #090909;
        --muted: rgba(20, 20, 20, 0.46);
        --surface: rgba(245, 245, 245, 0.992);
        --line: rgba(0, 0, 0, 0.075);
        --shadow:
          0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        --row-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          Inter, ui-sans-serif, system-ui, sans-serif;
        background: #ececec;
        color: var(--ink);
      }

      /* Quiet demo backdrop. The spotlight remains the visual focus. */
      .demo {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 20% 22%,
            rgba(255, 255, 255, 0.96) 0 8%,
            transparent 26%
          ),
          radial-gradient(
            circle at 82% 70%,
            rgba(255, 255, 255, 0.75) 0 10%,
            transparent 31%
          ),
          linear-gradient(135deg, #e8e8e8 0%, #f7f7f7 48%, #e5e5e5 100%);
      }
      .demo::before,
      .demo::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        filter: blur(10px);
        opacity: 0.75;
      }
      .demo::before {
        width: 34vw;
        height: 34vw;
        left: -8vw;
        bottom: -10vw;
        background: rgba(255, 255, 255, 0.7);
      }
      .demo::after {
        width: 26vw;
        height: 26vw;
        right: -6vw;
        top: -8vw;
        background: rgba(214, 214, 214, 0.6);
      }

      .launcher {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        user-select: none;
      }
      .launcher button {
        appearance: none;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: rgba(255, 255, 255, 0.78);
        color: #151515;
        padding: 12px 16px;
        border-radius: 13px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(20px);
        font:
          600 14px/1 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          sans-serif;
        cursor: pointer;
      }
      .launcher p {
        margin: 0;
        font-size: 13px;
        color: rgba(0, 0, 0, 0.42);
      }
      kbd {
        display: inline-flex;
        min-width: 22px;
        height: 22px;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        margin: 0 2px;
        border: 1px solid rgba(0, 0, 0, 0.09);
        border-bottom-color: rgba(0, 0, 0, 0.17);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.75);
        box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.04);
        font-size: 11px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .overlay.open {
        pointer-events: auto;
      }
      .launcher {
        transition: opacity 160ms ease;
      }
      body.spotlight-open .launcher {
        opacity: 0;
        pointer-events: none;
      }

      .stage {
        position: relative;
        width: min(768px, calc(100vw - 40px));
        min-height: 64px;
        transform-origin: center center;
        opacity: 0;
        filter: none;
        transform: translateY(-10px) scaleX(1.3) scaleY(1.1);
      }

      .search-card {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        min-height: 64px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 30px;
        color: #000;
        background: var(--surface);
        box-shadow: var(--shadow);
        z-index: 3;
        contain: layout style;
      }

      .input-row {
        height: 64px;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 24px;
      }
      .search-icon,
      .shortcut-icon,
      .result-icon,
      .chevron {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .search-icon svg {
        width: 28px;
        height: 28px;
        stroke-width: 1.45;
      }

      .input-wrap {
        position: relative;
        flex: 1;
        height: 34px;
        min-width: 0;
        display: flex;
        align-items: center;
      }
      .query {
        position: relative;
        z-index: 1;
        width: 100%;
        border: 0;
        outline: 0;
        padding: 0;
        margin: 0;
        color: #050505;
        background: transparent;
        font:
          400 24px/34px -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          sans-serif;
        caret-color: #111;
      }

      .placeholder {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 2;
        height: 34px;
        pointer-events: none;
        white-space: nowrap;
        font:
          400 24px/34px -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          sans-serif;
        color: #777;
        opacity: 1;
      }
      .placeholder-item {
        position: absolute;
        left: 0;
        top: 0;
        height: 34px;
        display: flex;
        align-items: center;
        white-space: nowrap;
        transform: translateY(0);
        filter: blur(0);
        opacity: 1;
      }
      .placeholder.result-mode .placeholder-item {
        color: #090909;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 5px;
        padding-right: 5px;
      }

      .results {
        display: none;
        border-top: 1px solid rgba(0, 0, 0, 0.075);
        background: #f5f5f5;
        padding: 8px;
        max-height: 384px;
        overflow-y: auto;
        contain: layout paint;
        scrollbar-width: none;
      }
      .results::-webkit-scrollbar {
        display: none;
      }
      .results.show {
        display: block;
      }

      .result {
        width: 100%;
        height: 52px;
        min-height: 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 9px;
        border-radius: 13px;
        color: #000;
        text-decoration: none;
        cursor: pointer;
        opacity: 0;
        transform: translateY(2px);
        transition:
          background-color 180ms ease,
          box-shadow 180ms ease;
      }
      .result:hover,
      .result.active {
        background: #fff;
        box-shadow: var(--row-shadow);
      }
      .result-icon {
        width: 32px;
        height: 32px;
      }
      .result-icon svg {
        width: 24px;
        height: 24px;
        stroke-width: 1.5;
      }
      .result-copy {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
        overflow: hidden;
      }
      .result-title {
        font-size: 16px;
        font-weight: 500;
        line-height: 20px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .result-title mark,
      .result-desc mark {
        color: inherit;
        background: rgba(0, 0, 0, 0.075);
        border-radius: 4px;
        padding: 0 1px;
      }
      .result-desc {
        font-size: 12px;
        line-height: 15px;
        color: rgba(0, 0, 0, 0.47);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty-result {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(0, 0, 0, 0.42);
        font-size: 14px;
        user-select: none;
      }
      .chevron {
        margin-left: auto;
        opacity: 0;
        transition: opacity 160ms ease;
      }
      .result:hover .chevron,
      .result.active .chevron {
        opacity: 1;
      }
      .chevron svg {
        width: 23px;
        height: 23px;
        stroke-width: 1.45;
      }

      .shortcut {
        position: absolute;
        top: 0;
        width: 64px;
        height: 64px;
        border-radius: 999px;
        background: #f5f5f5;
        color: #000;
        border: 0;
        box-shadow: none;
        display: grid;
        place-items: center;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        z-index: 2;
        will-change: transform, opacity;
      }
      .shortcut .inner {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: inherit;
        opacity: 0.3;
        transition:
          opacity 200ms ease,
          box-shadow 200ms ease;
      }
      .shortcut:hover .inner,
      .shortcut.hovered .inner {
        opacity: 1;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
      }
      .shortcut svg {
        width: 28px;
        height: 28px;
        stroke-width: 1.4;
      }

      .debug-note {
        position: fixed;
        left: 18px;
        bottom: 16px;
        z-index: 2;
        color: rgba(0, 0, 0, 0.3);
        font-size: 11px;
        letter-spacing: 0.01em;
        user-select: none;
        transition: opacity 160ms ease;
      }
      body.spotlight-open .debug-note {
        opacity: 0;
      }

      @media (max-width: 760px) {
        .stage {
          width: calc(100vw - 24px);
        }
        .query,
        .placeholder {
          font-size: 20px;
        }
        .input-row {
          padding-inline: 18px;
        }
        .shortcut {
          width: 56px;
          height: 56px;
          top: 4px;
        }
        .shortcut .inner {
          width: 56px;
          height: 56px;
        }
        .shortcut svg {
          width: 25px;
          height: 25px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo">
      <div class="launcher">
        <button id="openBtn">Open Spotlight</button>
        <p><kbd>⌘</kbd><kbd>K</kbd> or <kbd>Ctrl</kbd><kbd>K</kbd></p>
      </div>
    </div>
    <div class="debug-note">
      Smooth performance edition · compositor-first shortcuts · reduced layout
      work
    </div>

    <div class="overlay" id="overlay" aria-hidden="true">
      <div
        class="stage"
        id="stage"
        role="dialog"
        aria-modal="true"
        aria-label="Spotlight"
      >
        <div class="search-card" id="searchCard">
          <div class="input-row">
            <span class="search-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="7.4" />
                <path d="m20 20-3.9-3.9" />
              </svg>
            </span>
            <div class="input-wrap">
              <div class="placeholder" id="placeholder">
                <span class="placeholder-item">Search</span>
              </div>
              <input
                class="query"
                id="query"
                type="text"
                aria-label="Search shortcuts"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
          </div>
          <div class="results" id="results" role="listbox"></div>
        </div>

        <button
          class="shortcut"
          id="shortcut0"
          data-index="0"
          aria-label="Apps"
        ></button>
        <button
          class="shortcut"
          id="shortcut1"
          data-index="1"
          aria-label="Files"
        ></button>
        <button
          class="shortcut"
          id="shortcut2"
          data-index="2"
          aria-label="Actions"
        ></button>
        <button
          class="shortcut"
          id="shortcut3"
          data-index="3"
          aria-label="Clipboard"
        ></button>
      </div>
    </div>

    <script>
      (() => {
        const overlay = document.getElementById("overlay");
        const stage = document.getElementById("stage");
        const card = document.getElementById("searchCard");
        const query = document.getElementById("query");
        const placeholder = document.getElementById("placeholder");
        const resultsEl = document.getElementById("results");
        const openBtn = document.getElementById("openBtn");
        const shortcuts = [...document.querySelectorAll(".shortcut")];
        const reducedMotion = matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        const shortcutData = [
          { label: "Apps", icon: icon("grid") },
          { label: "Files", icon: icon("folder") },
          { label: "Actions", icon: icon("activity") },
          { label: "Clipboard", icon: icon("files") },
        ];

        const resultData = [
          {
            label: "Twitter",
            desc: "Open Twitter",
            aliases: ["x", "social"],
            icon: icon("twitter"),
          },
          {
            label: "Safari",
            desc: "Open web browser",
            aliases: ["browser", "web", "internet"],
            icon: icon("globe"),
          },
          {
            label: "Mail",
            desc: "Open Mail",
            aliases: ["email", "inbox"],
            icon: icon("mail"),
          },
          {
            label: "Calendar",
            desc: "View calendar",
            aliases: ["date", "schedule", "events"],
            icon: icon("calendar"),
          },
          {
            label: "Notes",
            desc: "Open Notes",
            aliases: ["note", "memo"],
            icon: icon("note"),
          },
          {
            label: "Photos",
            desc: "Browse photos",
            aliases: ["images", "pictures", "gallery"],
            icon: icon("image"),
          },
          {
            label: "Settings",
            desc: "Open Settings",
            aliases: ["preferences", "system"],
            icon: icon("settings"),
          },
          {
            label: "Terminal",
            desc: "Open Terminal",
            aliases: ["shell", "command", "console"],
            icon: icon("terminal"),
          },
          {
            label: "Finder",
            desc: "Open Finder",
            aliases: ["files", "folder"],
            icon: icon("folder"),
          },
          {
            label: "Messages",
            desc: "Open Messages",
            aliases: ["chat", "sms"],
            icon: icon("message"),
          },
          {
            label: "Music",
            desc: "Open Music",
            aliases: ["audio", "songs"],
            icon: icon("music"),
          },
        ];

        // pi-lens-ignore: ast-grep:no-inner-html-js
        shortcutData.forEach(
          (s, i) =>
            (shortcuts[i].innerHTML = `<span class="inner">${s.icon}</span>`)
        );

        let open = false;
        let expanded = false;
        let pointerInside = false;
        let hoveredShortcut = null;
        let hoveredResult = null;
        let activeResult = -1;
        let sequenceToken = 0;
        let placeholderToken = 0;
        let resultsVisible = false;
        let filteredResults = [];
        let searchRevision = 0;
        let focusSuggest = false;
        let allowFocusSuggestions = false;

        const defaultResults = [
          {
            label: "Safari",
            desc: "Open web browser",
            aliases: ["browser", "web", "internet"],
            icon: icon("globe"),
          },
          {
            label: "Mail",
            desc: "Open Mail",
            aliases: ["email", "inbox"],
            icon: icon("mail"),
          },
          {
            label: "Calendar",
            desc: "View calendar",
            aliases: ["date", "schedule", "events"],
            icon: icon("calendar"),
          },
          {
            label: "Notes",
            desc: "Open Notes",
            aliases: ["note", "memo"],
            icon: icon("note"),
          },
          {
            label: "Finder",
            desc: "Open Finder",
            aliases: ["files", "folder"],
            icon: icon("folder"),
          },
        ];

        const geom = {
          stageWidth: 768,
          searchFull: 768,
          searchCompact: 448,
          baseX: [464, 544, 624, 704],
          enterX: [400, 416, 432, 448],
          exitX: [704, 704, 704, 704],
          closedHeight: 66,
          resultsHeight: 448,
        };

        // These are Motion's duration+bounce springs resolved using its own findSpring math:
        // layout: duration .5s + bounce .2 => stiffness 323.589..., damping 28.781...
        // shortcut: duration .8s + bounce .2 => stiffness 126.402..., damping 17.988...
        const LAYOUT_K = 323.5894917400647;
        const LAYOUT_D = 28.781749405735674;
        const SHORTCUT_K = 126.40214521096279;
        const SHORTCUT_D = 17.988593378584795;

        const springNodes = {
          width: makeSpring(geom.searchFull, LAYOUT_K, LAYOUT_D),
          height: makeSpring(geom.closedHeight, LAYOUT_K, LAYOUT_D),
          x: [0, 1, 2, 3].map(i =>
            makeSpring(geom.exitX[i], SHORTCUT_K, SHORTCUT_D)
          ),
          scale: [0, 1, 2, 3].map(() =>
            makeSpring(0.7, SHORTCUT_K, SHORTCUT_D)
          ),
        };

        // One RAF loop, but layout writes and compositor writes are kept separate.
        // The old version rewrote width/height on every shortcut frame, forcing avoidable layout work.
        let raf = 0;
        let last = performance.now();
        const applied = {
          width: NaN,
          height: NaN,
          x: [NaN, NaN, NaN, NaN],
          scale: [NaN, NaN, NaN, NaN],
        };

        function applySpringStyles(force = false) {
          // width/height are the only layout-affecting writes. Only touch them when their own spring moved.
          if (
            force ||
            !Number.isFinite(applied.width) ||
            Math.abs(applied.width - springNodes.width.x) > 0.035
          ) {
            applied.width = springNodes.width.x;
            card.style.width = `${applied.width.toFixed(3)}px`;
          }
          if (
            force ||
            !Number.isFinite(applied.height) ||
            Math.abs(applied.height - springNodes.height.x) > 0.035
          ) {
            applied.height = springNodes.height.x;
            card.style.height = `${applied.height.toFixed(3)}px`;
          }
          shortcuts.forEach((el, i) => {
            const x = springNodes.x[i].x;
            const sc = springNodes.scale[i].x;
            if (
              force ||
              !Number.isFinite(applied.x[i]) ||
              Math.abs(applied.x[i] - x) > 0.02 ||
              Math.abs(applied.scale[i] - sc) > 0.0004
            ) {
              applied.x[i] = x;
              applied.scale[i] = sc;
              // translate3d keeps the shortcut motion on the compositor.
              el.style.transform = `translate3d(${x.toFixed(3)}px,0,0) scale(${sc.toFixed(5)})`;
            }
          });
        }

        function tick(now) {
          const rawDt = Math.min((now - last) / 1000, 0.04);
          last = now;
          const steps = Math.max(1, Math.ceil(rawDt / (1 / 120)));
          const dt = rawDt / steps;
          let moving = false;

          for (let n = 0; n < steps; n++) {
            moving = updateSpring(springNodes.width, dt) || moving;
            moving = updateSpring(springNodes.height, dt) || moving;
            shortcuts.forEach((_, i) => {
              moving = updateSpring(springNodes.x[i], dt) || moving;
              moving = updateSpring(springNodes.scale[i], dt) || moving;
            });
          }

          applySpringStyles(false);
          if (moving) raf = requestAnimationFrame(tick);
          else {
            // Snap the final sub-pixel values once, then stop touching the DOM entirely.
            applySpringStyles(true);
            raf = 0;
          }
        }
        function ensureTick() {
          if (!raf) {
            last = performance.now();
            raf = requestAnimationFrame(tick);
          }
        }
        function makeSpring(x, stiffness, damping) {
          return { x, v: 0, target: x, stiffness, damping };
        }
        function updateSpring(s, dt) {
          if (reducedMotion) {
            s.x = s.target;
            s.v = 0;
            return false;
          }
          const a = -s.stiffness * (s.x - s.target) - s.damping * s.v;
          s.v += a * dt;
          s.x += s.v * dt;
          if (Math.abs(s.v) < 0.01 && Math.abs(s.target - s.x) < 0.01) {
            s.x = s.target;
            s.v = 0;
            return false;
          }
          return true;
        }
        function target(s, value, resetVelocity = false) {
          if (
            !resetVelocity &&
            Math.abs(s.target - value) < 0.001 &&
            Math.abs(s.x - value) < 0.01 &&
            Math.abs(s.v) < 0.01
          )
            return;
          s.target = value;
          if (resetVelocity) s.v = 0;
          ensureTick();
        }
        function jump(s, value) {
          s.x = s.target = value;
          s.v = 0;
        }

        function recomputeGeometry() {
          const w = Math.max(300, Math.min(768, innerWidth - 40));
          const button = innerWidth <= 760 ? 56 : 64;
          const gap = innerWidth <= 760 ? 10 : 16;
          const rail = button * 4 + gap * 4;
          geom.stageWidth = w;
          geom.searchFull = w;
          geom.searchCompact = Math.max(260, w - rail);
          geom.baseX = [0, 1, 2, 3].map(
            i => geom.searchCompact + gap + i * (button + gap)
          );
          geom.enterX = [0, 1, 2, 3].map(i => geom.baseX[i] - button * (i + 1));
          geom.exitX = [0, 1, 2, 3].map(() => geom.baseX[3]);
          stage.style.width = `${w}px`;
          if (!open) resetClosedGeometry();
        }
        addEventListener("resize", recomputeGeometry);

        function resetClosedGeometry() {
          expanded = false;
          jump(springNodes.width, geom.searchFull);
          jump(springNodes.height, geom.closedHeight);
          card.style.width = `${geom.searchFull}px`;
          card.style.height = `${geom.closedHeight}px`;
          applied.width = geom.searchFull;
          applied.height = geom.closedHeight;
          shortcuts.forEach((el, i) => {
            jump(springNodes.x[i], geom.exitX[i]);
            jump(springNodes.scale[i], 0.7);
            el.style.transform = `translate3d(${geom.exitX[i]}px,0,0) scale(.7)`;
            applied.x[i] = geom.exitX[i];
            applied.scale[i] = 0.7;
            el.style.opacity = "0";
            el.style.pointerEvents = "none";
            el.classList.remove("hovered");
          });
        }

        function expandShortcuts() {
          if (!open || query.value) return;
          const token = ++sequenceToken;
          expanded = true;
          target(springNodes.width, geom.searchCompact);

          shortcuts.forEach((el, i) => {
            const hidden =
              parseFloat(getComputedStyle(el).opacity || "0") < 0.05;
            if (hidden) {
              jump(springNodes.x[i], geom.enterX[i]);
              jump(springNodes.scale[i], 0.7);
              el.style.transform = `translate3d(${geom.enterX[i]}px,0,0) scale(.7)`;
            }
            el.style.opacity = "1";
            el.style.pointerEvents = "auto";
            setTimeout(
              () => {
                if (token !== sequenceToken || !expanded || query.value) return;
                target(springNodes.x[i], geom.baseX[i]);
                target(springNodes.scale[i], 1);
              },
              reducedMotion ? 0 : i * 50
            );
          });
        }

        function collapseShortcuts({ search = false } = {}) {
          const token = ++sequenceToken;
          expanded = false;
          target(springNodes.width, geom.searchFull);
          hoveredShortcut = null;
          if (!search) setPlaceholder("Search");

          shortcuts.forEach((el, i) => {
            el.classList.remove("hovered");
            el.style.pointerEvents = "none";
            const delay = reducedMotion ? 0 : i * 50;
            setTimeout(() => {
              if (token !== sequenceToken || expanded) return;
              target(springNodes.x[i], geom.exitX[i]);
              target(springNodes.scale[i], 0.7);
            }, delay);
            // Motion keeps exit nodes present for the full .8s spring. Hide only afterwards.
            setTimeout(
              () => {
                if (token !== sequenceToken || expanded) return;
                el.style.opacity = "0";
              },
              reducedMotion ? 0 : 820 + i * 50
            );
          });
        }

        function openSpotlight() {
          if (open) return;
          open = true;
          sequenceToken++;
          overlay.classList.add("open");
          overlay.setAttribute("aria-hidden", "false");
          document.body.classList.add("spotlight-open");
          query.value = "";
          focusSuggest = false;
          allowFocusSuggestions = false;
          resultsVisible = false;
          resultsEl.classList.remove("show");
          resultsEl.innerHTML = "";
          placeholder.classList.remove("result-mode");
          placeholder.style.opacity = "1";
          setPlaceholder("Search", true);
          resetClosedGeometry();

          stage.getAnimations().forEach(a => a.cancel());
          stage.style.willChange = "transform, opacity";
          const openAnim = stage.animate(
            [
              {
                opacity: 0,
                transform: "translateY(-8px) scaleX(1.18) scaleY(1.06)",
              },
              { opacity: 1, transform: "translateY(0) scaleX(1) scaleY(1)" },
            ],
            {
              duration: reducedMotion ? 1 : 430,
              easing: reducedMotion ? "linear" : "cubic-bezier(.16,1,.3,1)",
              fill: "forwards",
            }
          );
          openAnim.onfinish = () => {
            if (open) stage.style.willChange = "auto";
          };
          allowFocusSuggestions = false;
          requestAnimationFrame(() => query.focus({ preventScroll: true }));
        }

        function closeSpotlight() {
          if (!open) return;
          open = false;
          pointerInside = false;
          collapseShortcuts();
          stage.style.willChange = "transform, opacity";
          const a = stage.animate(
            [
              { opacity: 1, transform: "translateY(0) scaleX(1) scaleY(1)" },
              {
                opacity: 0,
                transform: "translateY(8px) scaleX(1.18) scaleY(1.06)",
              },
            ],
            {
              duration: reducedMotion ? 1 : 280,
              easing: reducedMotion ? "linear" : "cubic-bezier(.4,0,.2,1)",
              fill: "forwards",
            }
          );
          a.onfinish = () => {
            overlay.classList.remove("open");
            overlay.setAttribute("aria-hidden", "true");
            document.body.classList.remove("spotlight-open");
            query.value = "";
            focusSuggest = false;
            allowFocusSuggestions = false;
            hideResults(true);
            resetClosedGeometry();
            stage.style.willChange = "auto";
          };
        }

        function setPlaceholder(text, instant = false, resultMode = false) {
          placeholder.classList.toggle("result-mode", resultMode);
          placeholder.style.opacity = "1";
          const token = ++placeholderToken;
          const old = placeholder.querySelector(".placeholder-item:last-child");
          if (instant || reducedMotion || (old && old.textContent === text)) {
            // pi-lens-ignore: ast-grep:no-inner-html-js
            placeholder.innerHTML = `<span class="placeholder-item">${escapeHTML(text)}</span>`;
            return;
          }

          const next = document.createElement("span");
          next.className = "placeholder-item";
          next.textContent = text;
          next.style.opacity = "0";
          next.style.transform = "translateY(10px)";
          next.style.filter = "blur(5px)";
          placeholder.appendChild(next);

          old?.animate(
            [
              { opacity: 1, transform: "translateY(0)", filter: "blur(0px)" },
              {
                opacity: 0,
                transform: "translateY(-10px)",
                filter: "blur(5px)",
              },
            ],
            { duration: 200, easing: "ease-out", fill: "forwards" }
          );
          next.animate(
            [
              {
                opacity: 0,
                transform: "translateY(10px)",
                filter: "blur(5px)",
              },
              { opacity: 1, transform: "translateY(0)", filter: "blur(0px)" },
            ],
            { duration: 200, easing: "ease-out", fill: "forwards" }
          );
          setTimeout(() => {
            if (token !== placeholderToken) return;
            [...placeholder.querySelectorAll(".placeholder-item")].forEach(
              el => {
                if (el !== next) el.remove();
              }
            );
            next.removeAttribute("style");
          }, 210);
        }

        function normalizeText(value) {
          return value
            .toLowerCase()
            .normalize("NFKD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim();
        }

        function fuzzyScore(text, needle) {
          if (!needle) return 0;
          const hay = normalizeText(text);
          const q = normalizeText(needle);
          if (!q) return 0;
          if (hay === q) return 1200;
          if (hay.startsWith(q))
            return 950 - Math.min(120, hay.length - q.length);
          const at = hay.indexOf(q);
          if (at >= 0)
            return 760 - at * 8 - Math.min(100, hay.length - q.length);

          // Lightweight ordered fuzzy matching: "trm" -> Terminal.
          let qi = 0,
            first = -1,
            last = -1,
            gaps = 0;
          for (let i = 0; i < hay.length && qi < q.length; i++) {
            if (hay[i] === q[qi]) {
              if (first < 0) first = i;
              if (last >= 0) gaps += i - last - 1;
              last = i;
              qi++;
            }
          }
          if (qi !== q.length) return -Infinity;
          return (
            420 - first * 9 - gaps * 13 - Math.max(0, hay.length - q.length) * 2
          );
        }

        function getFilteredResults(rawQuery) {
          const q = rawQuery.trim();
          if (!q) {
            return focusSuggest
              ? defaultResults.map((item, sourceIndex) => ({
                  ...item,
                  sourceIndex,
                  score: 0,
                }))
              : [];
          }
          return resultData
            .map((item, sourceIndex) => {
              const titleScore = fuzzyScore(item.label, q);
              const descScore = fuzzyScore(item.desc, q) - 75;
              const aliasScore = Math.max(
                ...(item.aliases || []).map(a => fuzzyScore(a, q) - 35),
                -Infinity
              );
              return {
                ...item,
                sourceIndex,
                score: Math.max(titleScore, descScore, aliasScore),
              };
            })
            .filter(item => Number.isFinite(item.score))
            .sort((a, b) => b.score - a.score || a.sourceIndex - b.sourceIndex);
        }

        function highlightMatch(text, rawQuery) {
          const q = rawQuery.trim();
          if (!q) return escapeHTML(text);
          const lower = text.toLowerCase();
          const qLower = q.toLowerCase();
          const at = lower.indexOf(qLower);
          if (at < 0) return escapeHTML(text);
          return `${escapeHTML(text.slice(0, at))}<mark>${escapeHTML(text.slice(at, at + q.length))}</mark>${escapeHTML(text.slice(at + q.length))}`;
        }

        function showResults() {
          collapseShortcuts({ search: true });
          placeholder.classList.remove("result-mode");
          placeholder.style.opacity = "0";
          const firstReveal = !resultsVisible;
          resultsVisible = true;
          resultsEl.classList.add("show");
          refreshSearchResults({ animateRows: firstReveal });
        }

        function hideResults(instant = false) {
          hoveredResult = null;
          resultsVisible = false;
          filteredResults = [];
          activeResult = -1;
          resultsEl.classList.remove("show");
          resultsEl.innerHTML = "";
          placeholder.classList.remove("result-mode");
          if (instant) {
            jump(springNodes.height, geom.closedHeight);
            applied.height = geom.closedHeight;
            card.style.height = `${geom.closedHeight}px`;
          } else target(springNodes.height, geom.closedHeight);
        }

        function refreshSearchResults({ animateRows = false } = {}) {
          const revision = ++searchRevision;
          filteredResults = getFilteredResults(query.value);
          activeResult = -1;
          hoveredResult = null;
          renderResults({ animateRows, revision });

          // Rows are fixed-height by design, so don't read scrollHeight after writing DOM.
          // This removes a synchronous style/layout flush on every keystroke.
          const listH = filteredResults.length
            ? Math.min(384, 16 + filteredResults.length * 52)
            : 88;
          geom.resultsHeight = geom.closedHeight + listH;
          target(springNodes.height, geom.resultsHeight);
        }

        function renderResults({
          animateRows = false,
          revision = searchRevision,
        } = {}) {
          if (!filteredResults.length) {
            const q = query.value.trim();
            // pi-lens-ignore: ast-grep:no-inner-html-js
            resultsEl.innerHTML = q
              ? `<div class="empty-result" role="status">No results for “${escapeHTML(q)}”</div>`
              : `<div class="empty-result" role="status">No suggestions</div>`;
            return;
          }

          const q = query.value;
          // pi-lens-ignore: ast-grep:no-inner-html-js
          resultsEl.innerHTML = filteredResults
            .map(
              (r, i) => `
      <a class="result${i === activeResult ? " active" : ""}" href="#" role="option" aria-selected="${i === activeResult}" data-result="${i}">
        <span class="result-icon">${r.icon}</span>
        <span class="result-copy"><span class="result-title">${highlightMatch(r.label, q)}</span><span class="result-desc">${highlightMatch(r.desc, q)}</span></span>
        <span class="chevron">${icon("chevron")}</span>
      </a>`
            )
            .join("");

          [...resultsEl.querySelectorAll(".result")].forEach((row, i) => {
            if (animateRows) {
              row.animate([{ opacity: 0 }, { opacity: 1 }], {
                duration: reducedMotion ? 1 : 180,
                delay: reducedMotion ? 0 : i * 55,
                easing: "ease-out",
                fill: "forwards",
              });
            } else {
              row.style.opacity = "1";
            }
          });
        }

        function executeResult(index, row) {
          const item = filteredResults[index];
          if (!item) return;
          flashSelection(row);
          // Demo action: preserve the original component's link-style behavior without navigating away.
          // Keeping this event makes it easy to wire real app actions later.
          card.dispatchEvent(
            new CustomEvent("spotlight:select", { detail: item })
          );
        }

        function updateActiveResult(next) {
          if (!resultsVisible || !filteredResults.length) return;
          activeResult =
            (next + filteredResults.length) % filteredResults.length;
          [...resultsEl.querySelectorAll(".result")].forEach((r, i) => {
            r.classList.toggle("active", i === activeResult);
            r.setAttribute("aria-selected", String(i === activeResult));
          });
          const row = resultsEl.querySelector(
            `[data-result="${activeResult}"]`
          );
          row?.scrollIntoView({ block: "nearest" });
          if (row) {
            placeholder.style.opacity = "1";
            setPlaceholder(filteredResults[activeResult].label, false, true);
          }
        }

        function flashSelection(row) {
          row.animate(
            [
              { transform: "scale(1)" },
              { transform: "scale(.985)" },
              { transform: "scale(1)" },
            ],
            { duration: 220, easing: "ease-out" }
          );
        }

        stage.addEventListener("mouseenter", () => {
          pointerInside = true;
          if (!query.value) expandShortcuts();
        });
        stage.addEventListener("mouseleave", () => {
          pointerInside = false;
          hoveredShortcut = null;
          if (!query.value) collapseShortcuts();
        });

        shortcuts.forEach((el, i) => {
          el.addEventListener("mouseenter", () => {
            hoveredShortcut = i;
            shortcuts.forEach((b, j) => b.classList.toggle("hovered", j === i));
            setPlaceholder(shortcutData[i].label);
          });
          // Deliberately no individual mouseleave reset: the source keeps the last shortcut label
          // until the pointer leaves the whole compound control.
          el.addEventListener("click", e => {
            e.preventDefault();
            e.stopPropagation();
            const from = el.style.transform;
            el.animate(
              [
                { transform: from },
                {
                  transform: `translate3d(${springNodes.x[i].x}px,0,0) scale(.92)`,
                },
                { transform: from },
              ],
              { duration: 210, easing: "ease-out" }
            );
          });
        });

        // One delegated listener survives result re-renders, avoiding listener churn while typing.
        resultsEl.addEventListener("pointerover", e => {
          const row = e.target.closest?.(".result");
          if (!row || !resultsEl.contains(row)) return;
          const i = Number(row.dataset.result);
          if (
            !Number.isInteger(i) ||
            i === hoveredResult ||
            !filteredResults[i]
          )
            return;
          hoveredResult = i;
          activeResult = i;
          [...resultsEl.querySelectorAll(".result")].forEach((r, j) => {
            r.classList.toggle("active", j === i);
            r.setAttribute("aria-selected", String(j === i));
          });
          placeholder.style.opacity = "1";
          setPlaceholder(filteredResults[i].label, false, true);
        });
        resultsEl.addEventListener("click", e => {
          const row = e.target.closest?.(".result");
          if (!row || !resultsEl.contains(row)) return;
          e.preventDefault();
          const i = Number(row.dataset.result);
          if (Number.isInteger(i)) executeResult(i, row);
        });

        resultsEl.addEventListener("mouseleave", () => {
          hoveredResult = null;
          placeholder.classList.remove("result-mode");
          if (query.value) placeholder.style.opacity = "0";
        });

        query.addEventListener("input", () => {
          if (query.value.trim()) {
            focusSuggest = false;
            if (resultsVisible) refreshSearchResults({ animateRows: false });
            else showResults();
          } else if (
            allowFocusSuggestions &&
            document.activeElement === query
          ) {
            focusSuggest = true;
            if (resultsVisible) refreshSearchResults({ animateRows: false });
            else showResults();
            setPlaceholder("Search", true);
            placeholder.style.opacity = "1";
          } else {
            focusSuggest = false;
            hideResults();
            setPlaceholder("Search", true);
            placeholder.style.opacity = "1";
            if (pointerInside) expandShortcuts();
            else collapseShortcuts();
          }
        });

        query.addEventListener("focus", () => {
          if (!allowFocusSuggestions) return;
          if (!query.value.trim()) {
            focusSuggest = true;
            showResults();
            setPlaceholder("Search", true);
            placeholder.style.opacity = "1";
          }
        });

        query.addEventListener("pointerdown", () => {
          allowFocusSuggestions = true;
          if (!query.value.trim()) {
            focusSuggest = true;
            if (resultsVisible) refreshSearchResults({ animateRows: false });
            else showResults();
            setPlaceholder("Search", true);
            placeholder.style.opacity = "1";
          }
        });

        query.addEventListener("blur", () => {
          // Keep the default suggestions visible while the pointer is interacting with the panel.
          // Clicking outside still closes the whole Spotlight via the overlay handler.
          if (!query.value.trim() && !pointerInside) {
            focusSuggest = false;
            hideResults();
          }
        });

        query.addEventListener("keydown", e => {
          if (resultsVisible) {
            if (e.key === "ArrowDown" && filteredResults.length) {
              e.preventDefault();
              updateActiveResult(activeResult < 0 ? 0 : activeResult + 1);
            } else if (e.key === "ArrowUp" && filteredResults.length) {
              e.preventDefault();
              updateActiveResult(
                activeResult < 0 ? filteredResults.length - 1 : activeResult - 1
              );
            } else if (
              e.key === "Enter" &&
              activeResult >= 0 &&
              filteredResults.length
            ) {
              e.preventDefault();
              const row = resultsEl.querySelector(
                `[data-result="${activeResult}"]`
              );
              if (row) executeResult(activeResult, row);
            }
          }
          if (e.key === "Escape") {
            e.preventDefault();
            if (query.value) {
              query.value = "";
              query.dispatchEvent(new Event("input"));
            } else closeSpotlight();
          }
        });

        overlay.addEventListener("mousedown", e => {
          if (e.target === overlay) closeSpotlight();
        });
        document.addEventListener("keydown", e => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            open ? closeSpotlight() : openSpotlight();
          }
        });
        openBtn.addEventListener("click", openSpotlight);

        function escapeHTML(value) {
          return value.replace(
            /[&<>'"]/g,
            ch =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;",
              })[ch]
          );
        }

        function icon(name) {
          const common = `viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"`;
          const map = {
            grid: `<svg ${common}><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg>`,
            folder: `<svg ${common}><path d="M3.5 7.5h6l1.7 2h9.3v8.7a2.3 2.3 0 0 1-2.3 2.3H5.8a2.3 2.3 0 0 1-2.3-2.3z"/><path d="M3.5 9V6.3A2.3 2.3 0 0 1 5.8 4h3l2 2.3h7.4A2.3 2.3 0 0 1 20.5 8v1.5"/></svg>`,
            activity: `<svg ${common}><path d="M3 12h4l2.1-5.2L13 17l2.2-5H21"/></svg>`,
            files: `<svg ${common}><path d="M7 3.5h8.5L20 8v10.5A2.5 2.5 0 0 1 17.5 21H7a2.5 2.5 0 0 1-2.5-2.5V6A2.5 2.5 0 0 1 7 3.5Z"/><path d="M15 3.8V8h4.2"/><path d="M8.5 12h7M8.5 15.5h7"/></svg>`,
            twitter: `<svg ${common}><path d="M21 5.8c-.7.4-1.5.7-2.3.8a4 4 0 0 0-6.8 3.6A11.3 11.3 0 0 1 3.7 6a4 4 0 0 0 1.2 5.3c-.6 0-1.2-.2-1.8-.5 0 2 1.4 3.7 3.4 4.1-.6.2-1.2.2-1.8.1.5 1.7 2.1 2.9 3.9 2.9A8 8 0 0 1 3 19.4 11.2 11.2 0 0 0 9.1 21c7.3 0 11.3-6 11.3-11.3v-.5c.8-.6 1.4-1.2 2-2-.7.3-1.5.5-2.3.6.8-.5 1.4-1.2 1.7-2Z"/></svg>`,
            globe: `<svg ${common}><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>`,
            mail: `<svg ${common}><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>`,
            calendar: `<svg ${common}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>`,
            note: `<svg ${common}><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`,
            image: `<svg ${common}><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-4.5-4.5L7 20"/></svg>`,
            settings: `<svg ${common}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H10.4v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-3.2h.1A1.7 1.7 0 0 0 4.7 9.3a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h3.2v.1A1.7 1.7 0 0 0 14.7 4.7a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.15.36.39.69.7.93.31.24.7.37 1.1.37h.1v3.2h-.1a1.7 1.7 0 0 0-1.8 1.5Z"/></svg>`,
            terminal: `<svg ${common}><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M12.5 15h4"/></svg>`,
            message: `<svg ${common}><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>`,
            music: `<svg ${common}><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>`,
            chevron: `<svg ${common}><path d="m9 18 6-6-6-6"/></svg>`,
          };
          return map[name] || "";
        }

        recomputeGeometry();
        setTimeout(openSpotlight, 260);
      })();
    </script>
  </body>
</html>
