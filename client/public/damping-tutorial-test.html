<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>滑动阻尼测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-size: 2vmin;
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      background: #171717;
      color: #101010;
    }

    .viewbox {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      align-items: flex-start;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .scrollbox {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
      transition: .3s ease-out;
    }

    .box {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(18px + 1vw);
      font-weight: 700;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <div class="viewbox">
    <div class="scrollbox">
      <div class="box" style="background-color: #17f700;">#17f700</div>
      <div class="box" style="background-color: #ffc93e;">#ffc93e</div>
      <div class="box" style="background-color: #0084FF; color: #fff;">#0084FF</div>
      <div class="box" style="background-color: #FF3842; color: #fff;">#FF3842</div>
      <div class="box" style="background-color: #d44040; color: #fff;">#d44040</div>
    </div>
  </div>

  <script>
    const scrollbox = document.getElementsByClassName("scrollbox")[0];

    function resize_body() {
      const height = scrollbox.offsetHeight;
      document.body.style.height = `${height}px`;
    }

    function scroll() {
      scrollbox.style.transform = `translateY(${-window.scrollY}px)`;
    }

    window.addEventListener("scroll", scroll, { passive: true });
    window.addEventListener("load", resize_body);
    window.addEventListener("resize", resize_body);
  </script>
</body>
</html>
