<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>fezer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Gravitas+One&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script type="text/javascript">
      // Restores the original route from ?redirect= without triggering another server request.
      // Mirrors the base-path heuristic in 404.html: repo subpath (e.g. /fezer/) is
      // prepended, custom-domain root is not. redirect already starts with '/'.
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          var parts = window.location.pathname.split('/');
          var hasSubpath = parts.length > 2 && parts[1] && !parts[1].includes('.');
          var basePath = hasSubpath ? '/' + parts[1] : '';
          history.pushState(null, '', basePath + redirect);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
